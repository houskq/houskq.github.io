<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HouskaCze_0 | YouTube</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(145, 60, 255, 0.20), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(90, 30, 255, 0.16), transparent 30%),
        #07070b;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: #7b2cff;
      filter: blur(180px);
      opacity: 0.10;
      top: -200px;
      left: -150px;
      pointer-events: none;
    }

    nav {
      position: sticky;
      top: 20px;
      z-index: 100;
      width: calc(100% - 40px);
      max-width: 1150px;
      margin: 20px auto;
      padding: 16px 22px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      border-radius: 20px;
      box-shadow:
        0 0 35px rgba(125, 40, 255, 0.12);
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #a855f7;
      text-shadow: 0 0 15px #8b5cf6;
    }

    .back {
      text-decoration: none;
      color: white;
      padding: 10px 16px;
      border-radius: 12px;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);

      transition: 0.25s;
    }

    .back:hover {
      background: rgba(155, 80, 255, 0.18);
      border-color: rgba(180, 100, 255, 0.45);
      box-shadow: 0 0 20px rgba(145, 60, 255, 0.25);
      transform: translateY(-2px);
    }

    .container {
      width: calc(100% - 40px);
      max-width: 1150px;
      margin: 80px auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 55px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 75px);
      letter-spacing: -3px;
      margin-bottom: 15px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #c084fc,
        #8b5cf6,
        #ffffff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow: 0 0 40px rgba(140, 60, 255, 0.25);
    }

    .hero p {
      color: #a1a1aa;
      font-size: 17px;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .video {
      overflow: hidden;
      border-radius: 22px;

      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.10);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.25);

      transition: 0.3s ease;
    }

    .video:hover {
      transform: translateY(-8px);

      border-color: rgba(170, 90, 255, 0.45);

      box-shadow:
        0 15px 50px rgba(115, 40, 255, 0.25),
        0 0 30px rgba(130, 50, 255, 0.12);
    }

    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      transition: 0.4s;
    }

    .video:hover .thumbnail img {
      transform: scale(1.05);
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 58px;
      height: 58px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background: rgba(130, 50, 255, 0.85);
      box-shadow:
        0 0 25px rgba(140, 60, 255, 0.65);

      font-size: 23px;

      transition: 0.25s;
    }

    .video:hover .play {
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow:
        0 0 40px rgba(160, 70, 255, 0.9);
    }

    .info {
      padding: 20px;
    }

    .info h2 {
      font-size: 19px;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .date {
      color: #92929a;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .watch {
      display: inline-block;

      text-decoration: none;
      color: white;

      padding: 11px 17px;
      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #a855f7
      );

      box-shadow:
        0 0 20px rgba(139, 92, 246, 0.25);

      font-weight: 700;

      transition: 0.25s;
    }

    .watch:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 30px rgba(139, 92, 246, 0.55);
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px;
      color: #aaa;
    }

    .error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px;
      color: #ff8b8b;

      background: rgba(255, 50, 50, 0.05);
      border: 1px solid rgba(255, 80, 80, 0.15);
      border-radius: 20px;
    }

    .channel {
      text-align: center;
      margin-top: 55px;
    }

    .channel a {
      display: inline-block;

      text-decoration: none;
      color: white;

      padding: 15px 25px;
      border-radius: 15px;

      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);

      box-shadow: 0 0 25px rgba(130, 50, 255, 0.12);

      transition: 0.25s;
    }

    .channel a:hover {
      background: rgba(140, 60, 255, 0.18);
      box-shadow: 0 0 35px rgba(140, 60, 255, 0.35);
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 50px 20px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 850px) {
      .videos {
        grid-template-columns: 1fr;
      }

      .container {
        margin-top: 55px;
      }

      nav {
        width: calc(100% - 25px);
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="logo">
    Houska<span>Cze_0</span>
  </div>

  <a class="back" href="index.html">
    ← Zpět na web
  </a>
</nav>

<main class="container">

  <section class="hero">
    <h1>Moje videa</h1>
    <p>Nejnovější videa z mého YouTube kanálu 🎬</p>
  </section>

  <section class="videos" id="videos">

    <div class="loading">
      ⏳ Načítám nejnovější videa...
    </div>

  </section>

  <div class="channel">
    <a
      href="https://www.youtube.com/@HouskaCze_0"
      target="_blank">
      ▶ Navštívit můj YouTube kanál
    </a>
  </div>

</main>

<footer>
  © 2026 HouskaCze_0 • Všechna práva vyhrazena
</footer>


<script>

  const CHANNEL_ID = "UCGp2M6SV6p73i3avA0nAwKQ";

  const RSS_URL =
    `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;

  const API_URL =
    `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

  const videosContainer =
    document.getElementById("videos");


  function formatDate(dateString) {

    const date = new Date(dateString);

    return date.toLocaleDateString("cs-CZ", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  }


  async function loadVideos() {

    try {

      const response = await fetch(API_URL);

      if (!response.ok) {
        throw new Error("API request failed");
      }

      const data = await response.json();

      if (data.status !== "ok" || !data.items) {
        throw new Error("Nepodařilo se načíst videa.");
      }

      const latestVideos = data.items.slice(0, 3);

      videosContainer.innerHTML = "";


      latestVideos.forEach(video => {

        const videoId =
          video.guid.split(":").pop();

        const thumbnail =
          `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;


        const card =
          document.createElement("article");

        card.className = "video";


        card.innerHTML = `

                    <a
                        href="${video.link}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="thumbnail">

                        <img
                            src="${thumbnail}"
                            alt="${escapeHtml(video.title)}"
                            onerror="this.src='https://i.ytimg.com/vi/${videoId}/hqdefault.jpg';">

                        <div class="play">
                            ▶
                        </div>

                    </a>

                    <div class="info">

                        <h2>
                            ${escapeHtml(video.title)}
                        </h2>

                        <div class="date">
                            ${formatDate(video.pubDate)}
                        </div>

                        <a
                            class="watch"
                            href="${video.link}"
                            target="_blank"
                            rel="noopener noreferrer">

                            ▶ Přehrát video

                        </a>

                    </div>
                `;


        videosContainer.appendChild(card);

      });


    } catch (error) {

      console.error(error);

      videosContainer.innerHTML = `

                <div class="error">

                    <h2>⚠️ Videa se nepodařilo načíst</h2>

                    <p style="margin-top:10px;">
                        Zkus stránku obnovit.
                    </p>

                </div>

            `;

    }

  }


  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  loadVideos();

</script>

</body>
</html>
