<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

/* =========================================================
   V7 FX HELPERS
========================================================= */
function v7Particles(x,y,count=18,colors=["#8d6cff","#35e8ff","#ffd34e"]){
    for(let i=0;i<count;i++){
        const p=document.createElement("span");
        p.className="v7-particle";
        p.style.left=`${x}px`;
        p.style.top=`${y}px`;
        p.style.color=colors[Math.floor(Math.random()*colors.length)];
        p.style.setProperty("--dx",`${(Math.random()-.5)*260}px`);
        p.style.setProperty("--dy",`${(Math.random()-.72)*240}px`);
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),800);
    }
}
function spawnCoinBurst(){
    const el=document.getElementById("coins") || document.querySelector(".coins");
    const r=el?.getBoundingClientRect();
    const x=r?r.left+r.width/2:window.innerWidth/2;
    const y=r?r.top+r.height/2:90;
    v7Particles(x,y,24,["#ffd34e","#fff2a8","#ffb52e"]);
    const f=document.createElement("div");
    f.className="v7-coin-float";
    f.textContent="+🪙 SOLD";
    f.style.left=`${x}px`;f.style.top=`${y}px`;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1100);
}
function v7Cinematic(item){
    const rarity=String(item?.rarity||"").toLowerCase();
    if(rarity!=="mythic" && rarity!=="legendary") return;
    const flash=document.createElement("div");
    flash.className="v7-flash";
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(),500);
    const box=document.getElementById("resultBox");
    if(box){
        box.classList.remove("v7-result-pop");
        void box.offsetWidth;
        box.classList.add("v7-result-pop");
    }
    if(rarity==="mythic"){
        const vig=document.createElement("div");
        vig.className="v7-mythic-vignette";
        document.body.appendChild(vig);
        setTimeout(()=>vig.remove(),1000);
        v7Particles(innerWidth/2,innerHeight/2,70,["#ff3df2","#8d6cff","#35e8ff","#fff"]);
    }else{
        v7Particles(innerWidth/2,innerHeight/2,38,["#ffd34e","#fff","#ff9d3d"]);
    }
}


document.addEventListener("click", e => {
    const b=e.target.closest("button");
    if(!b) return;
    const r=b.getBoundingClientRect();
    v7Particles(r.left+r.width/2,r.top+r.height/2,8,["#ffffff","#8d6cff","#35e8ff"]);
});

</script>

.reward-card{
    position:relative;
    overflow:hidden;
    background:

    grid-template-columns:repeat(2,minmax(180px,1fr));

.result-action{
    border:none;
    border-radius:13px;
    padding:14px 18px;

    font-weight:1000;
    font-size:14px;

    border:1px solid rgba(255,255,255,.1);

.result-action:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
}

.result-action:active{
    transform:translateY(0) scale(.98);
}

.result-action.sell{
    background:linear-gradient(135deg,#19a86b,#08784a);
    border-color:rgba(74,255,165,.25);
}

.result-action.continue{
    background:linear-gradient(135deg,#8b5cf6,#5b3cc4);
    border-color:rgba(190,160,255,.3);
}

.result-action.open-again{
    grid-column:1/-1;

/* =========================================================
   HELPERS
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   MONEY
========================================================= */

function money(value){

    return Number(value || 0)
        .toLocaleString("cs-CZ");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );

}


/* =========================================================
   NORMALIZE ITEM
========================================================= */

function normalizeItem(item){

    if(typeof item === "string"){

        return {

            name:item,

            rarity:"common",

            value:0,

            texture:
                TEXTURES[item] || ""

        };

    }


    if(!item || typeof item !== "object"){

        return {

            name:"Unknown Item",

            rarity:"common",

            value:0,

            texture:""

        };

    }


    const name =
        item.name ||
        "Unknown Item";


    const rarity =
        RARITIES[item.rarity]
        ?
        item.rarity
        :
        "common";


    const value =
        Number(item.value) || 0;


    const texture =
        item.texture ||
        TEXTURES[name] ||
        "";


    return {

        name:name,

        rarity:rarity,

        value:value,

        texture:texture

    };

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const container =
        $("toastContainer");

    const element =
        document.createElement("div");

    element.className =
        "toast";

    element.textContent =
        message;

    container.appendChild(
        element
    );

    setTimeout(
        () => {

            element.style.opacity =
                "0";

            element.style.transform =
                "translateY(10px)";

            setTimeout(
                () => element.remove(),
                250
            );

        },
        2800
    );

}


/* =========================================================
   RANDOM
========================================================= */

function randomItem(array){

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* =========================================================
   GET RARITY
========================================================= */

function rollRarity(){

    let luckMultiplier =
        1 +
        (
            Math.max(
                0,
                luckLevel - 1
            ) * .08
        );

    let roll =
        Math.random() * 100;

    const entries =
        Object.entries(RARITIES);

    let total =
        0;

    for(
        const [key,data]
        of entries
    ){

        let chance =
            data.chance;

        if(
            key !== "common"
        ){

            chance *=
                luckMultiplier;

        }

        total += chance;

        if(
            roll <= total
        ){

            return key;

        }

    }

    return "common";

}


/* =========================================================
   GET ITEM
========================================================= */

function getRandomItem(caseId){

    const list =
        ITEMS[caseId] ||
        ITEMS.grass;

    const rarity =
        rollRarity();

    let candidates =
        list.filter(
            item =>
                item.rarity === rarity
        );

    if(!candidates.length){

        candidates =
            list;

    }

    const item =
        normalizeItem(
            randomItem(candidates)
        );

    return item;

}


/* =========================================================
   ADD INVENTORY
========================================================= */

function addInventory(item){

    const normalized =
        normalizeItem(item);

    const existing =
        inventory.find(
            x =>
                normalizeItem(x).name
                ===
                normalized.name
        );

    if(existing){

        existing.count =
            Number(existing.count || 1)
            + 1;

        return;

    }

    inventory.push({

        ...normalized,

        count:1

    });

}

/* =========================================================
   SELECT OPEN MULTIPLIER
========================================================= */

async function selectOpenLevel(level){

    level =
        Number(level);

    if(
        level < 1 ||
        level > openLevel
    ){

        return;

    }

    activeOpenLevel =
        level;

    localStorage.setItem(
        STORAGE.activeOpenLevel,
        activeOpenLevel
    );

    renderAll();

    await saveCloud();

    toast(
        `Aktivní multiplier: ${level}×`
    );

}


/* =========================================================
   UPGRADE OPEN MULTIPLIER
========================================================= */

async function upgradeOpen(){

    if(
        openLevel >= 5
    ){

        return;

    }

    const next =
        openLevel + 1;

    const price =
        OPEN_LEVEL_COSTS[next];


    if(
        coins < price
    ){

        toast(
            "Nemáš dost coinů."
        );

        return;

    }


    coins -=
        price;

    openLevel =
        next;

    /*
        Po koupi nového levelu
        ho rovnou nastavíme jako aktivní.
    */

    activeOpenLevel =
        next;


    saveLocal();

    renderAll();

    await saveCloud();

    toast(
        `Odemčeno ${next}× Open Multiplier!`
    );

}

/* =========================================================

========================================================= */

function findAffordableCase(){

    /*
        Preferujeme nejdražší dostupný case.
    */

    const sorted =
        [...CASES]
        .sort(
            (a,b) =>
                b.price - a.price
        );

    return sorted.find(
        c =>
            coins >=
            c.price *
            activeOpenLevel
    );

}

/* =========================================================
   OPEN CASE
========================================================= */

async function openCase(
    caseId,
    fromAuto = false
){

    if(currentOpening) return;

    const caseData = CASES.find(c => c.id === caseId);
    if(!caseData) return;

    currentOpening = true;

    try{

        while(true){

            const multiplier = activeOpenLevel;
            const totalPrice = caseData.price * multiplier;

            if(coins < totalPrice){
                if(!fromAuto) toast("Nemáš dost coinů.");
                break;
            }

            coins -= totalPrice;
            casesOpened += multiplier;

            saveLocal();
            renderCoins();
            renderCases();

            const results = [];
            for(let i = 0; i < multiplier; i++){
                results.push(getRandomItem(caseId));
            }

            /* AUTO SELL = bez animace, okamžitý prodej */
            if(autoSellUnlocked){
                const totalSell = results.reduce(
                    (sum,item) => sum + Number(item.value || 0),
                    0
                );

                coins += totalSell;
                saveLocal();
                renderCoins();
                renderCases();
                await saveCloud();
                toast(`Auto Sell: +🪙 ${money(totalSell)}`);
                break;
            }

            const resultAction = await showOpening(results, caseData);

            const rewardTotal = results.reduce(
                (sum,item) => sum + Number(item.value || 0),
                0
            );

            if(resultAction === "sell"){
                /* PRODAT / PRODAT VŠE = právě zobrazené odměny */
                coins += rewardTotal;
                saveLocal();
                renderAll();
                await saveCloud();
                spawnCoinBurst();
                toast(`💰 Výhra prodána za 🪙 ${money(rewardTotal)}`);
                break;
            }

            /* CONTINUE i OPEN AGAIN nejdřív bezpečně uloží výhry */
            results.forEach(item => addInventory(item));
            saveLocal();
            renderAll();
            await saveCloud();

            if(resultAction === "openAgain"){
                await sleep(180);
                continue;
            }

            /* Continue / zavření výsledku */
            break;
        }

    }finally{
        currentOpening = false;
    }

}

/* =========================================================
   CREATE ONE REEL
========================================================= */

function createOpeningReel(
    result,
    caseData,
    laneIndex,
    totalLanes
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "reel-card";


    const label =
        document.createElement(
            "div"
        );

    label.className =
        "reel-label";

    label.textContent =
        `CASE #${laneIndex + 1}`;


    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "reel-wrapper";


    const reel =
        document.createElement(
            "div"
        );

    reel.className =
        "reel";


    /*
        35 itemů jako předtím.

        Poslední item je vždy skutečný
        výsledek tohoto konkrétního
        reelu.
    */

    const totalVisual =
        35;


    for(
        let i = 0;
        i < totalVisual;
        i++
    ){

        let item;

        if(
            i === totalVisual - 1
        ){

            item =
                result;

        }else{

            item =
                getRandomItem(
                    caseData.id
                );

        }

        reel.appendChild(
            createReelItem(
                item
            )
        );

    }


    wrapper.appendChild(
        reel
    );

    card.appendChild(
        label
    );

    card.appendChild(
        wrapper
    );


    return {

        card:card,

        wrapper:wrapper,

        reel:reel,

        totalVisual:totalVisual

    };

}


/* =========================================================
   SHOW OPENING
========================================================= */

async function showOpening(
    results,
    caseData
){

    pendingResults =
        results.map(
            item => normalizeItem(item)
        );

    pendingCaseId =
        caseData.id;

    const overlay =
        $("openingOverlay");

    const resultBox =
        $("resultBox");

    const openingReels =
        $("openingReels");


    overlay.classList.add(
        "show"
    );


    resultBox.classList.remove(
        "show"
    );


    /*
        Reset výsledkového UI.
    */

    $("multipleResults").style.display =
        "none";

    $("multipleResults").innerHTML =
        "";

    $("multipleTotal").style.display =
        "none";

    $("multipleTotal").textContent =
        "";


    $("resultRarity").style.display =
        "";

    $("resultName").style.display =
        "";

    $("resultImage").style.display =
        "";

    $("resultValue").style.display =
        "";

    $("sellPreview").style.display =
        "";


    $("openingTitle").textContent =
        `OPENING ${results.length}×`;


    $("openingSubtitle").textContent =
        `⚡ Faster Spin +${fasterSpinLevel}%`;


    openingReels.innerHTML =
        "";


    /*
        Vytvoříme samostatný reel pro
        KAŽDÝ skutečný výsledek.
    */

    const lanes = [];


    results.forEach(
        (
            result,
            index
        ) => {

            const lane =
                createOpeningReel(
                    result,
                    caseData,
                    index,
                    results.length
                );

            openingReels.appendChild(
                lane.card
            );

            lanes.push(
                lane
            );

        }
    );


    await sleep(100);


    /*
        Faster Spin

        0%  = 4200 ms
        10% = 3780 ms
        20% = 3360 ms

        Minimum 1000 ms.
    */

    const baseDuration =
        4200;


    const duration =
        Math.max(
            1000,
            baseDuration *
            (
                1 -
                fasterSpinLevel / 100
            )
        );


    /*
        Spouštíme všechny reely
        současně.

        Každý má vlastní wrapper,
        takže každý může být přesně
        vystředěný.
    */

    const animations =
        lanes.map(
            (
                lane,
                index
            ) => {

                return animateReel(
                    lane,
                    duration,
                    index
                );

            }
        );


    await Promise.all(
        animations
    );


    /*
        Po zastavení reelů ukážeme
        výsledky.
    */

    resultBox.classList.add(
        "show"
    );


    if(
        results.length === 1
    ){

        showResult(
            results[0]
        );

    }else{

        showMultipleResults(
            results
        );

    }


    return await waitForResultClose();

}


/* =========================================================
   ANIMATE ONE REEL
========================================================= */

async function animateReel(
    lane,
    duration,
    laneIndex
){

    const reel =
        lane.reel;

    const wrapper =
        lane.wrapper;

    const totalVisual =
        lane.totalVisual;


    reel.style.transition =
        "none";

    reel.style.transform =
        "translateX(0)";


    await sleep(60);


    /*
        Šířka itemu zůstává 145px
        a gap 12px.

        Protože každý reel má svůj
        vlastní wrapper, počítáme
        střed samostatně.
    */

    const itemWidth =
        145;

    const gap =
        12;

    const step =
        itemWidth +
        gap;


    const visibleWidth =
        wrapper.clientWidth;


    const center =
        visibleWidth / 2;


    /*
        Skutečný výsledek je úplně
        poslední item.
    */

    const targetIndex =
        totalVisual - 1;


    const targetCenter =
        targetIndex *
        step +
        itemWidth / 2;


    const finalX =
        center -
        targetCenter;


    /*
        Drobný rozdíl mezi lanes,
        aby všechny nebyly úplně
        identické na milisekundu.
    */

    const stagger =
        laneIndex *
        55;


    reel.style.transition =
        `transform ${duration + stagger}ms cubic-bezier(.08,.72,.16,1)`;


    reel.style.transform =
        `translateX(${finalX}px)`;


    await sleep(
        duration +
        stagger +
        150
    );

}

/* =========================================================
   RESULT ACTIONS
========================================================= */

function waitForResultClose(){

    return new Promise(
        resolve => {

            const sellButton =
                $("sellResult");

            const continueButton =
                $("continueResult");

            const openAgainButton =
                $("openAgainResult");


            const finish =
                action => {

                    if(pendingResultResolver !== null){

                        return;

                    }

                    pendingResultResolver =
                        resolve;

                    sellButton.removeEventListener(
                        "click",
                        sellHandler
                    );

                    continueButton.removeEventListener(
                        "click",
                        continueHandler
                    );

                    openAgainButton.removeEventListener(
                        "click",
                        openAgainHandler
                    );


                    $("openingOverlay")
                        .classList.remove(
                            "show"
                        );

                    $("resultBox")
                        .classList.remove(
                            "show"
                        );

                    $("openingReels")
                        .innerHTML =
                        "";

                    pendingResults =
                        [];

                    pendingCaseId =
                        "";

                    const resolver =
                        pendingResultResolver;

                    pendingResultResolver =
                        null;

                    resolver(action);

                };


            const sellHandler =
                () => {

                    const total =
                        pendingResults.reduce(
                            (sum,item) =>
                                sum +
                                Number(
                                    item.value || 0
                                ),
                            0
                        );

                    sellButton.textContent =
                        `💰 PRODAT — 🪙 ${money(total)}`;

                    finish("sell");

                };


            const continueHandler =
                () => {

                    finish("continue");

                };


            const openAgainHandler =
                () => {

                    finish("openAgain");

                };


            sellButton.addEventListener(
                "click",
                sellHandler
            );

            continueButton.addEventListener(
                "click",
                continueHandler
            );

            openAgainButton.addEventListener(
                "click",
                openAgainHandler
            );


            /*
                Pro jistotu reset textu po každém
                novém reward screenu.
            */
            sellButton.textContent =
                pendingResults.length > 1
                ? "💰 PRODAT VŠE"
                : "💰 PRODAT";

        }
    );

}

/* =========================================================
   LOAD LOCAL
========================================================= */

function loadLocal(){

    const savedCoins =
        localStorage.getItem(
            STORAGE.coins
        );


    if(
        savedCoins !== null
    ){

        coins =
            Number(
                savedCoins
            ) || 250;

    }


    try{

        const savedInventory =
            localStorage.getItem(
                STORAGE.inventory
            );


        if(
            savedInventory
        ){

            inventory =
                JSON.parse(
                    savedInventory
                );

        }

    }catch{

        inventory =
            [];

    }


    openLevel =
        Math.max(
            1,
            Math.min(
                5,
                Number(
                    localStorage.getItem(
                        STORAGE.openLevel
                    )
                ) || 1
            )
        );


    activeOpenLevel =
        Math.max(
            1,
            Math.min(
                openLevel,
                Number(
                    localStorage.getItem(
                        STORAGE.activeOpenLevel
                    )
                ) || 1
            )
        );


    luckLevel =
        Math.max(
            1,
            Math.min(
                5,
                Number(
                    localStorage.getItem(
                        STORAGE.luckLevel
                    )
                ) || 1
            )
        );


    fasterSpinLevel =
        Math.max(
            0,
            Math.min(
                20,
                Number(
                    localStorage.getItem(
                        STORAGE.fasterSpinLevel
                    )
                ) || 0
            )
        );


    autoOpenUnlocked =
        localStorage.getItem(
            STORAGE.autoOpen
        ) === "true";


    autoSellUnlocked =
        localStorage.getItem(
            STORAGE.autoSell
        ) === "true";


    /*
        Opravíme staré inventory data.
    */

    inventory =
        Array.isArray(inventory)
        ?
        inventory.map(
            item => {

                const normalized =
                    normalizeItem(
                        item
                    );

                return {

                    ...normalized,

                    count:
                        Number(
                            item?.count || 1
                        )

                };

            }
        )
        :
        [];

}

    fasterSpinLevel =
        Math.max(
            0,
            Math.min(
                20,
                Number(
                    data.faster_spin_level
                ) || 0
            )
        );


    autoOpenUnlocked =
        Boolean(
            data.auto_open_unlocked
        );


    autoSellUnlocked =
        Boolean(
            data.auto_sell_unlocked
        );


    casesOpened =
        Number(
            data.cases_opened
        ) || 0;


    saveLocal();

    return true;

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const input =
        $("nicknameInput");

    const error =
        $("loginError");

    const button =
        $("loginButton");


    const value =
        input.value.trim();


    if(
        !/^[a-zA-Z0-9_]{3,20}$/.test(
            value
        )
    ){

        error.textContent =
            "Nick musí mít 3–20 znaků a může obsahovat pouze písmena, čísla a _.";

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "PŘIHLAŠOVÁNÍ...";

    error.textContent =
        "";


    nickname =
        value;


    const success =
        await loadCloudPlayer();


    if(!success){

        error.textContent =
            "Nepodařilo se připojit k online databázi.";

        button.disabled =
            false;

        button.textContent =
            "HRÁT";

        return;

    }


    localStorage.setItem(
        STORAGE.nickname,
        nickname
    );


    $("nicknameDisplay").textContent =
        nickname;


    $("loginOverlay").style.display =
        "none";


    renderAll();

    loadLeaderboard();


    button.disabled =
        false;

    button.textContent =
        "HRÁT";

}


/* =========================================================
   SAVED NICKNAME
========================================================= */

async function loadSavedNickname(){

    const saved =
        localStorage.getItem(
            STORAGE.nickname
        );


    if(!saved){

        return;

    }


    $("nicknameInput").value =
        saved;

}


/* =========================================================
   LEADERBOARD
========================================================= */

async function loadLeaderboard(){

    const body =
        $("leaderboardBody");

    body.innerHTML = `

        <tr>

            <td colspan="4">
                Načítám...
            </td>

        </tr>

    `;


    const {
        data,
        error
    } =
        await supabaseClient

            .from(
                "minecraft_cases_players"
            )

            .select(
                "nickname,coins,cases_opened"
            )

            .order(
                "coins",
                {
                    ascending:false
                }
            )

            .limit(
                100
            );


    if(error){

        console.error(
            error
        );

        body.innerHTML = `

            <tr>

                <td colspan="4">
                    Leaderboard se nepodařilo načíst.
                </td>

            </tr>

        `;

        return;

    }


    if(
        !data ||
        !data.length
    ){

        body.innerHTML = `

            <tr>

                <td colspan="4">
                    Zatím zde nikdo není.
                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML =
        data
        .map(
            (
                player,
                index
            ) => `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHtml(
                            player.nickname
                        )}
                    </td>

                    <td>
                        🪙 ${
                            money(
                                player.coins
                            )
                        }
                    </td>

                    <td>
                        ${
                            money(
                                player.cases_opened
                            )
                        }
                    </td>

                </tr>

            `
        )
        .join("");

}


/* =========================================================
   EVENTS
========================================================= */

$("loginButton")
    .addEventListener(
        "click",
        login
    );


$("nicknameInput")
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter"
            ){

                login();

            }

        }
    );


$("sellAllButton")
    .addEventListener(
        "click",
        sellAll
    );


/* =========================================================
   INITIALIZE
========================================================= */

loadLocal();

renderAll();

loadSavedNickname();


/*
    Pokud je uložený nick,
    přihlášení stále musí proběhnout
    přes Supabase, aby se načetl
    aktuální online progres.

    Pokud uživatel klikne HRÁT,
    login() načte cloud data.
*/


</script>
